  <g id="text_26">
   <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="34.56" y="466.128" transform="rotate(-0 34.56 466.128)">Stayed at 1 worker: M5 Llama 2 7B Q4 / Q8 · A100 Qwen 32B FP16</text>
  </g>
  <g id="text_27">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="34.56" y="485.784" transform="rotate(-0 34.56 485.784)">Memory admission declined another replica under observed headroom. No OOM in these runs.</text>
  </g>
  <g id="text_28">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #626975" transform="translate(34.56 528.713438)">Fixed-input bursts, 6–128 requests; one measured run per configuration, not a performance guarantee.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #626975" transform="translate(34.56 542.213438)">M5: 32 GiB unified memory. A100: 80 GiB VRAM. Ratios use each workload’s own baseline.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #626975" transform="translate(34.56 555.713438)">Source: recorded HTTP/SSE experiments, policy poc-3 · 21 Oct 2026</text>
